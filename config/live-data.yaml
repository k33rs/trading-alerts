app:
  # Maximum idle wait; the bot scans immediately when another pair is already due.
  scan_interval_seconds: 300
  risk_per_trade_pct: 0.01
  position_value_pct: 0.01
  # 20 requests at 11 seconds each are paced within each active scan cycle.
  historical_request_budget: 20
  # Timed-out pairs yield their slot so the dynamic universe can keep rotating.
  historical_failure_retry_seconds: 3600
  timeframe_refresh_seconds:
    1h: 3600
    2h: 7200
    4h: 14400
    1d: 86400
    1wk: 604800
    1mo: 2592000

telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID

data_source:
  default_provider: ibkr
  providers:
    ibkr:
      host: 127.0.0.1
      account_mode: paper
      live_port: 4001
      paper_port: 4002
      profiles:
        live_gateway:
          host: 127.0.0.1
          live_port: 4001
          paper_port: 4002
        paper_gateway:
          host: 127.0.0.1
          live_port: 4001
          paper_port: 4002
        live_tws:
          host: 127.0.0.1
          live_port: 7496
          paper_port: 7497
        paper_tws:
          host: 127.0.0.1
          live_port: 7496
          paper_port: 7497
      client_id: 7
      read_only: true
      min_rows: 220
      timeout: 20
      request_pause_seconds: 11.0
      # Automatically resolve the active front-month futures contract at runtime.
      auto_roll_futures: true
      # Skip contracts expiring sooner than this many calendar days when possible.
      min_days_to_expiry: 7
      default_what_to_show: TRADES
      # Match TWS charts with "Use RTH" enabled. Set use_rth: false on an
      # individual instrument only when extended-hours candles are intentional.
      default_use_rth: true
    binance:
      base_url: https://api.binance.com
      min_rows: 220
      timeout: 20

universe:
  enabled: true
  database_path: data/universe.db
  client_id: 18
  snapshot_max_age_seconds: 21600
  # Keep macro anchors always available; stocks and ETFs enter only through IBKR hot scans.
  core_symbols: [ES, NQ, ESTX50, HSI, ZC, ZS, CL, GC, EURUSD, GBPUSD, USDJPY, AUDUSD, NZDUSD, USDCAD, USDCHF, EURGBP, EURJPY, GBPJPY, AUDJPY]
  # Liquid individual shares from the maintained watchlist. These do not bypass
  # qualification: each must pass the same weekly/monthly regime and daily
  # alignment, countertrend-pullback, or neutral-pullback test as a scanner candidate.
  watchlist_candidates: [AAPL, MSFT, NVDA, META, AMZN, GOOG, GOOGL, TSLA, ACGL, CASY, KO, COR, DD, HLT, HST, HWM, JKHY, KDP, LLY, MCD, MKC, NEM, PEP, PFE, PM, V, JPM, SNDK, ABBV, AXON, BX, CAH, CBOE, CCEP, CHRW, CMS, COST, DE, DOW, ECL, EME, ETR, FAST, FOX, HCA, HPQ, HUBB, IFF, ISRG, KMB, KR, LEN, LH, MSTR, MTB, NI, NKE, ORLY, PGR, SHOP, T, TER, TKO, TMUS, UBER, VRTX, WELL, ZBRA, AXA, AKE, BC, BGN, BN, BOL, DSFIR, EDEN, ENI, FRE, GFC, GLE, LDO, LOTB, SAF, TE, CVC, DTE]
  # Qualify a priority segment of this list and reserve capacity for scanners.
  watchlist_candidate_limit: 50
  max_dynamic_candidates: 300
  # Validate candidates from one five-year daily-history request, resampled into
  # daily, weekly, and monthly closes. Weekly/monthly must agree; daily may
  # align with the regime or be a countertrend pullback.
  trend_filter:
    enabled: true
    interval: 1d
    max_candidates: 75
    fast_ema: 20
    slow_ema: 50
    slope_lookback: 5
    min_ema_separation_pct: 0.01
    # Retain the last qualified snapshot if Gateway loss prevents most checks.
    minimum_qualification_coverage_pct: 0.80
  sources:
    - name: us_top_percent_gainers
      enabled: true
      # The current account's scanner entitlement supports this US equity bucket.
      # EU retail accounts can be blocked from ETFs/ETNs/funds without a KID.
      allowed_stock_types: [COMMON]
      priority: 10
      provider: ibkr
      instrument: STK
      location_code: STK.US.MAJOR
      scan_code: TOP_PERC_GAIN
      rows: 50
      min_price: 10.0
    - name: us_top_percent_losers
      enabled: true
      # Keep short-side opportunities on equal footing with upward momentum.
      allowed_stock_types: [COMMON]
      priority: 10
      provider: ibkr
      instrument: STK
      location_code: STK.US.MAJOR
      scan_code: TOP_PERC_LOSE
      rows: 50
      min_price: 10.0
    - name: us_hot_by_volume
      enabled: true
      allowed_stock_types: [COMMON]
      priority: 20
      provider: ibkr
      instrument: STK
      location_code: STK.US.MAJOR
      scan_code: HOT_BY_VOLUME
      rows: 40
      min_price: 10.0
    - name: us_most_active
      enabled: true
      allowed_stock_types: [COMMON]
      priority: 30
      provider: ibkr
      instrument: STK
      location_code: STK.US.MAJOR
      scan_code: MOST_ACTIVE
      rows: 40
      min_price: 10.0
    - name: us_futures_gainers
      enabled: true
      priority: 15
      provider: ibkr
      instrument: FUT.US
      location_code: FUT.US
      scan_code: TOP_PERC_GAIN
      rows: 15
    - name: us_futures_losers
      enabled: true
      priority: 15
      provider: ibkr
      instrument: FUT.US
      location_code: FUT.US
      scan_code: TOP_PERC_LOSE
      rows: 15
    - name: north_american_futures_gainers
      enabled: true
      priority: 15
      provider: ibkr
      instrument: FUT.NA
      location_code: FUT.NA
      scan_code: TOP_PERC_GAIN
      rows: 15
    - name: north_american_futures_losers
      enabled: true
      priority: 15
      provider: ibkr
      instrument: FUT.NA
      location_code: FUT.NA
      scan_code: TOP_PERC_LOSE
      rows: 15
    - name: european_futures_gainers
      enabled: true
      priority: 15
      provider: ibkr
      instrument: FUT.EU
      location_code: FUT.EU
      scan_code: TOP_PERC_GAIN
      rows: 15
    - name: european_futures_losers
      enabled: true
      priority: 15
      provider: ibkr
      instrument: FUT.EU
      location_code: FUT.EU
      scan_code: TOP_PERC_LOSE
      rows: 15
    - name: asia_pacific_futures_gainers
      enabled: true
      priority: 15
      provider: ibkr
      instrument: FUT.HK
      location_code: FUT.HK
